[main]
font=Noto Sans CJK:size=13
terminal=foot -e
prompt="  "
placeholder="Search..."
icons-enabled=yes
icon-theme=Papirus-Dark

width=40
lines=15
horizontal-pad=32
vertical-pad=14
inner-pad=8
tabs=4

anchor=center
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

match-mode=fzf
sort-result=yes

[colors]
background=101014f2
text=d8dee9ff
input=ffffffff
prompt=ff5f7aff
placeholder=6f7480ff

match=ff5f7aff

selection=25252eff
selection-text=ffffffff
selection-match=ff879aff

border=3b3b48ff
counter=6f7480ff

[border]
width=2
radius=18
selection-radius=10

[key-bindings]
cancel=Escape Control+c
execute=Return KP_Enter
prev=Up Control+p
next=Down Control+n
delete-prev=BackSpace Control+h
delete-prev-word=Control+BackSpace Control+w
clipboard-paste=Control+v
