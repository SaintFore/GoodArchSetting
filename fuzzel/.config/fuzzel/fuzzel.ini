[main]
font=Noto Sans CJK:size=13
terminal=foot -e
prompt="❯ "
placeholder="Search..."
icons-enabled=yes
icon-theme=Papirus-Dark

width=36
lines=12
horizontal-pad=32
vertical-pad=14
inner-pad=8
tabs=4

anchor=center
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

match-mode=fzf
sort-result=yes

[colors]
background=0b0b0eff
text=f5f5f5ff
input=ffffffff
prompt=ff304fff
placeholder=8a8a8aff

match=ff304fff
selection=1a1a20ff
selection-text=ffffffff
selection-match=ff5c6cff

border=ff304fff
counter=8a8a8aff

[border]
width=2
radius=14
selection-radius=10

[key-bindings]
cancel=Escape Control+c
execute=Return KP_Enter
prev=Up Control+p
next=Down Control+n
delete-prev=BackSpace Control+h
delete-prev-word=Control+BackSpace Control+w
clipboard-paste=Control+v
