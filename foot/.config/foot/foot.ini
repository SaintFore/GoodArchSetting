[main]
font=MonaspiceNe Nerd Font Mono:size=12
letter-spacing=0
pad=10x10
shell=/usr/bin/zsh

app-id=foot

include=/usr/share/foot/themes/tokyonight-night

[cursor]
style=beam
blink=yes

[scrollback]
lines=100000

[url]
launch=xdg-open ${url}

[csd]
preferred=client
size=0
border-color=ff1c1c1c
border-width=1

[key-bindings]
scrollback-up-half-page=Control+Shift+k
scrollback-down-half-page=Control+Shift+j
prompt-prev=Control+Shift+z
prompt-next=Control+Shift+x
search-start=Control+Shift+r
